name: Static checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Repository and host checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install verified actionlint
        run: |
          actionlint_bin="$(./tools/install-actionlint.sh "$RUNNER_TEMP/actionlint")"
          echo "ACTIONLINT_BIN=${actionlint_bin}" >> "$GITHUB_ENV"

      - name: Validate repository and run host tests
        run: ./tools/validate.sh --static

      - name: Install audio test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libopus0 ffmpeg

      - name: Decode Ogg fixtures using the host reference codec
        run: python3 tests/test_memo_ogg_decode.py
